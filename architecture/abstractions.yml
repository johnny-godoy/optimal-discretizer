# Registry of the shared abstractions of src/optimal_discretizer. Read .claude/rules/reuse.md before you edit it.
#
# Register a contract or an entry point that more than one module uses. Do not register a private helper or a class
# that only one module uses. Search first: `uv run python -m scripts.check_abstractions --search <words>`.
# `uv run python -m scripts.check_abstractions --check` validates this file against the source.
#
# Fields: id (kebab-case, stable), responsibility (one sentence), owner (module or package that owns the symbol),
# symbol (module:Name), consumers (descriptive, grants no import right), keywords (for the search), status (active or
# deprecated), context (production unless the entry says otherwise).
schema_version: 1

capabilities:
  - id: base-error
    responsibility: Be the base class of every error that the package raises on purpose
    owner: optimal_discretizer.core
    symbol: optimal_discretizer.core.exceptions:OptimalDiscretizerError
    consumers: [optimal_discretizer.domain, optimal_discretizer.adapters]
    keywords: [error, exception, raise, base]
    status: active

  - id: exact-kmeans-1d
    responsibility: Cluster one-dimensional values into a given number of clusters with the smallest inertia
    owner: optimal_discretizer.domain
    symbol: optimal_discretizer.domain.clustering:kmeans_1d
    consumers: [optimal_discretizer.domain.scorers, optimal_discretizer.adapters]
    keywords: [kmeans, cluster, partition, smawk, optimal, inertia]
    status: active

  - id: clustering-result
    responsibility: Hold the labels, the centroids and the inertia of one clustering
    owner: optimal_discretizer.domain
    symbol: optimal_discretizer.domain.clustering:Clustering1D
    consumers: [optimal_discretizer.domain.scorers, optimal_discretizer.adapters]
    keywords: [clustering, labels, centroids, inertia, result]
    status: active

  - id: n-bins-selector
    responsibility: Choose the number of bins of a feature from a sweep of clusterings
    owner: optimal_discretizer.domain
    symbol: optimal_discretizer.domain.scorers:NBinsSelector
    consumers: [optimal_discretizer.adapters]
    keywords: [scorer, selector, n_bins, knee, elbow, mdl]
    status: active

  - id: candidate-fit
    responsibility: Pair one number of bins with its exact clustering, as the input of a selector
    owner: optimal_discretizer.domain
    symbol: optimal_discretizer.domain.scorers:CandidateFit
    consumers: [optimal_discretizer.adapters]
    keywords: [candidate, fit, sweep, n_bins]
    status: active

exceptions: []
