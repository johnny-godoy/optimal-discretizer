# `prek install` installs both shims. The commit-msg hooks check the message of each commit
# (.claude/rules/commits-and-prs.md). Every other hook runs at the pre-commit stage only, so a message check does not
# run the whole suite again.
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

exclude = '''(?x)^(
  (.*/)?\.venv/|
  (.*/)?__pycache__/
)'''

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  # reason: uv.lock is generated and grows with the dependency tree, so the 500 KB limit cannot apply to it.
  { id = "check-added-large-files", exclude = '^uv\.lock$', priority = 0 },
  { id = "check-ast", priority = 0 },
  { id = "check-case-conflict", priority = 0 },
  { id = "check-executables-have-shebangs", priority = 0 },
  { id = "check-illegal-windows-names", priority = 0 },
  { id = "check-merge-conflict", args = ["--assume-in-merge"], priority = 0 },
  { id = "check-symlinks", priority = 0 },
  { id = "check-toml", priority = 0 },
  { id = "check-yaml", priority = 0 },
  { id = "destroyed-symlinks", priority = 0 },
  { id = "name-tests-test", args = ["--pytest-test-first"], priority = 0 },
  { id = "detect-private-key", priority = 0 },
  { id = "fix-byte-order-marker", priority = 10 },
  { id = "mixed-line-ending", priority = 11 },
  { id = "trailing-whitespace", priority = 12 },
  { id = "end-of-file-fixer", priority = 13 },
]

# hadolint lints each Dockerfile. hadolint-py downloads the binary, so the hook needs no Docker.
[[repos]]
repo = "https://github.com/AleksaC/hadolint-py"
rev = "v2.15.1"
hooks = [
  { id = "hadolint", priority = 40 },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-json5", priority = 0 },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.7"
hooks = [
  { id = "actionlint", args = ["-shellcheck="], files = "^\\.github/workflows/.*\\.ya?ml$", priority = 40 },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-format",
    name = "ruff format",
    language = "system",
    entry = "uv run ruff format",
    types_or = ["python", "pyi"],
    priority = 40,
  },
  {
    id = "ruff-check",
    name = "ruff check",
    language = "system",
    entry = "uv run ruff check --fix --no-unsafe-fixes",
    types_or = ["python", "pyi"],
    priority = 41,
  },
  {
    id = "vulture",
    name = "vulture",
    language = "system",
    entry = "uv run vulture src tests scripts .github/scripts",
    types = ["python"],
    pass_filenames = false,
    priority = 42,
  },
  {
    id = "deptry",
    name = "deptry: declared and imported dependencies agree",
    language = "system",
    # src only: the check covers the runtime dependencies of the published package. Scripts and tests use the dev
    # group, so they have no declared-dependency contract.
    entry = "uv run deptry src",
    files = "^(src/.*\\.py|pyproject\\.toml|uv\\.lock)$",
    pass_filenames = false,
    priority = 43,
  },
  {
    id = "jscpd",
    name = "jscpd: copy-paste in src stays under 1%",
    language = "node",
    additional_dependencies = ["jscpd@5.4.2"],
    # This hook keeps the total share under 1% and needs no git history. A small new clone can still pass beneath that
    # limit, so check-new-clones (CI and the manual stage) fails on each clone that the base branch lacks. Tests repeat
    # setup on purpose, so they are not scanned.
    entry = "jscpd src --format python --min-tokens 50 --min-lines 5 --threshold 1 --reporters console --no-colors",
    files = "^src/.*\\.py$",
    pass_filenames = false,
    priority = 44,
  },
  {
    id = "check-new-clones",
    name = "jscpd: the change adds no clone to src",
    language = "system",
    # Manual stage: it needs the base branch in the local clone, which a commit hook cannot assume. CI runs it on every
    # pull request. Locally: `just clones`.
    entry = "uv run python -m scripts.check_new_clones",
    files = "^(src/.*\\.py|scripts/check_new_clones\\.py)$",
    pass_filenames = false,
    stages = ["manual"],
    priority = 45,
  },
  {
    id = "pyrefly",
    name = "pyrefly",
    language = "system",
    entry = "uv run pyrefly check src tests scripts .github/scripts",
    types = ["python"],
    pass_filenames = false,
    priority = 70,
  },
  {
    id = "pyrefly-coverage",
    name = "pyrefly type coverage is 100%",
    language = "system",
    entry = "uv run pyrefly coverage check src tests scripts .github/scripts",
    types = ["python"],
    pass_filenames = false,
    priority = 71,
  },
  {
    id = "check-ignores",
    name = "workarounds carry a written reason",
    language = "system",
    entry = "uv run python -m scripts.check_ignores",
    files = "\\.(py|toml)$",
    pass_filenames = false,
    priority = 50,
  },
  {
    id = "check-exclusions",
    name = "uv cooldown exemptions are still needed",
    language = "system",
    entry = "uv run python -m scripts.check_exclusions",
    files = "(^|/)(pyproject\\.toml|uv\\.lock)$",
    pass_filenames = false,
    priority = 50,
  },
  {
    id = "check-changelog",
    name = "the changelog, its fragments and the version agree",
    language = "system",
    entry = "uv run python -m scripts.check_changelog",
    files = "^(CHANGELOG\\.md|pyproject\\.toml|changelog\\.d/.*)$",
    pass_filenames = false,
    priority = 50,
  },
  {
    id = "check-abstractions",
    name = "registry of shared abstractions matches the source",
    language = "system",
    entry = "uv run python -m scripts.check_abstractions --check",
    files = "^(architecture/|src/.*\\.py|scripts/check_abstractions\\.py|pyproject\\.toml)",
    pass_filenames = false,
    priority = 50,
  },
  {
    id = "check-contract-overlap",
    name = "no public Protocol or ABC repeats another",
    language = "system",
    entry = "uv run python -m scripts.check_contract_overlap",
    files = "^(architecture/|src/.*\\.py|scripts/check_(abstractions|contract_overlap)\\.py|pyproject\\.toml)",
    pass_filenames = false,
    priority = 51,
  },
  {
    id = "import-linter",
    name = "import-linter: layers and vendor SDK limits",
    language = "system",
    # The editable install of meson-python reports a virtual path for the package, so the script lets import-linter
    # read the package from src (scripts/lint_imports.py). The contracts are those of pyproject.toml.
    entry = "uv run python -m scripts.lint_imports",
    files = "\\.py$|^pyproject\\.toml$",
    pass_filenames = false,
    priority = 60,
  },
  {
    id = "check-layout",
    name = "directory layout follows the rules, and no banned file exists",
    language = "system",
    entry = "uv run python -m scripts.check_layout",
    always_run = true,
    pass_filenames = false,
    priority = 50,
  },
  {
    id = "semgrep-rules-test",
    name = "semgrep: tests of the in-house rules",
    language = "system",
    entry = "uv run semgrep --test semgrep --metrics=off",
    files = "^semgrep/",
    pass_filenames = false,
    priority = 60,
  },
  {
    id = "semgrep",
    name = "semgrep: in-house design rules",
    language = "system",
    entry = "uv run semgrep scan --config semgrep/rules.yml --error --quiet --metrics=off --disable-version-check src tests scripts",
    files = "^(semgrep/|src/|tests/|scripts/|notebooks/)|^\\.semgrepignore$",
    pass_filenames = false,
    priority = 60,
  },
  {
    id = "check-ruleset",
    name = "required checks of the ruleset report on every pull request",
    language = "system",
    entry = "uv run python -m scripts.check_ruleset",
    files = "^\\.github/(rulesets/.*\\.json|workflows/.*\\.ya?ml)$",
    pass_filenames = false,
    priority = 50,
  },
  {
    id = "commitizen",
    name = "commit message: conventional commit",
    language = "system",
    entry = "uv run --frozen --only-group commits cz check -l 72 --commit-msg-file",
    stages = ["commit-msg"],
    priority = 0,
  },
  {
    id = "commit-style",
    name = "commit message: subject style",
    language = "system",
    entry = "uv run --frozen --only-group commits python -m scripts.check_commits --message-file",
    stages = ["commit-msg"],
    priority = 0,
  },
  {
    id = "uv-lock-check",
    name = "uv lock --check",
    language = "system",
    entry = "uv lock --check",
    files = "^(pyproject\\.toml|uv\\.lock)$",
    pass_filenames = false,
    priority = 0,
  },
]
